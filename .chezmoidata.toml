# Template data. chezmoi passes these values to every template; this file is
# never written to the home directory.

# The pwsh ZIP that sshd runs. Change both values together; see "Bump sshd's
# pwsh" in the README. .chezmoiexternal.toml.tmpl unpacks this version into
# ~/.local/opt/pwsh-<version>, script 11 points sshd's DefaultShell at it, and
# ~/.local/bin/sshd-pwsh-drift.ps1 compares it with the interactive MSIX pwsh.
[sshdPwsh]
    version = "7.6.7"
    sha256 = "d2f952ebdbf24386cb8923553aa58e41a846db35a6155ea04c58142a4b16dbb7"

# The MSYS2 toolchains that mise's Rubies build native gems with, one per gcc
# major version. ~/.local/bin/ruby-toolchains.ps1 builds them in
# ~/.local/opt/msys2 and links each Ruby to the one it was built with. See
# "Ruby native extensions" and "Add or move a gcc toolchain" in the README.
[rubyToolchains]
    # Where copies of the dated package sets and the base archive are kept, as
    # assets of one release of this repo. MSYS2 deletes old package files
    # without notice, and a rebuilt machine has no cache, so without a copy an
    # old toolchain could stop being buildable. Each set is one .tar that is
    # uploaded once and never changed. See "Add or move a gcc toolchain" in
    # the README for how one is uploaded.
    archive = "https://github.com/jcouball/windows-dev-config/releases/download/ruby-toolchain-sets"

    # The archive a new toolchain starts from, from
    # github.com/msys2/msys2-installer/releases. Only a toolchain built after
    # a change here uses the new one.
    [rubyToolchains.msys2Base]
        version = "20260927"
        sha256 = "ad336cccfda47758b5e15cda993fbba421115cb0b126697daef1ee4dfe37209f"

    # One toolchain per gcc major version. `date` is the day whose UCRT64
    # packages the toolchain gets: each one at the newest version MSYS2 had
    # published by then. `version` is the gcc that day implies; the script
    # asks the compiler and fails if it disagrees, so a wrong date cannot
    # produce a mislabelled toolchain.
    #
    # 14 and 15 are each the last day before MSYS2 moved to the next major.
    # 16 is the day before MSYS2 moved to OpenSSL 4.
    [rubyToolchains.gcc.14]
        date = "2025-04-24"
        version = "14.2.0"
    [rubyToolchains.gcc.15]
        date = "2026-04-29"
        version = "15.2.0"
    [rubyToolchains.gcc.16]
        date = "2026-11-14"
        version = "16.2.0"

    [rubyToolchains.packages]
        # UCRT64 packages, without the mingw-w64-ucrt-x86_64- prefix, taken
        # as of each toolchain's date. gcc brings binutils, the C runtime and
        # headers with it. The first line is the compiler side of what
        # `ridk install 3` installs; the second is the libraries that building
        # Ruby itself needs, which gems that wrap them use too.
        ucrt64 = [
            "gcc", "make", "pkgconf", "tools-git", "libmangle-git",
            "openssl", "libyaml", "libffi", "zlib", "gmp",
        ]
        # MSYS-side build tools, the rest of `ridk install 3`'s list. These
        # are not dated: they come from MSYS2's current packages on the day a
        # toolchain is built.
        msys = [
            "autoconf", "autogen", "automake-wrapper", "diffutils", "file",
            "gawk", "grep", "libtool", "m4", "make", "patch", "sed",
            "texinfo", "texinfo-tex", "wget", "pkgconf",
        ]

# The two fonts shared with Neuromancer and rama: MesloLGS NF for every
# terminal, Fira Code for the VS Code editor. winget cannot install a font
# here, so .chezmoiexternal.toml.tmpl downloads the files into the per-user
# font folder and script 13 registers them. See "Fonts" in the README.
#
# CHANGING A PIN NEEDS A STEP BY HAND. Windows keeps an installed font file
# open, so chezmoi cannot replace one and the apply fails at the download. See
# "Fonts" in the README before changing a commit, version or checksum here.
#
# `name` is what Windows calls the font, and what script 13 registers it as.
# It is the description GetFontResourceInfoW reports for the file, which is
# the name Windows itself uses when it installs a font.
[fonts]
    # Four files from github.com/romkatv/powerlevel10k-media, at one commit.
    # Each sha256 is of the .ttf file.
    [fonts.meslo]
        commit = "145eb9fbc2f42ee408dacd9b22d8e6e0e553f83d"
        [[fonts.meslo.files]]
            file = "MesloLGS NF Regular.ttf"
            name = "MesloLGS NF Regular"
            sha256 = "d97946186e97f8d7c0139e8983abf40a1d2d086924f2c5dbf1c29bd8f2c6e57d"
        [[fonts.meslo.files]]
            file = "MesloLGS NF Bold.ttf"
            name = "MesloLGS NF Bold"
            sha256 = "b6c0199cf7c7483c8343ea020658925e6de0aeb318b89908152fcb4d19226003"
        [[fonts.meslo.files]]
            file = "MesloLGS NF Italic.ttf"
            name = "MesloLGS NF Italic"
            sha256 = "6f357bcbe2597704e157a915625928bca38364a89c22a4ac36e7a116dcd392ef"
        [[fonts.meslo.files]]
            file = "MesloLGS NF Bold Italic.ttf"
            name = "MesloLGS NF Bold Italic"
            sha256 = "56b4131adecec052c4b324efb818dd326d586dbc316fc68f98f1cae2eb8d1220"

    # Six static weights from one release archive of github.com/tonsky/FiraCode.
    # The sha256 is of the zip. Change `version` and `sha256` together. The
    # archive's variable font, variable_ttf/FiraCode-VF.ttf, is left out: the
    # VS Code setting uses only named weights, which these six provide.
    [fonts.firaCode]
        version = "6.2"
        sha256 = "0949915ba8eb24d89fd93d10a7ff623f42830d7c5ffc3ecbf960e4ecad3e3e79"
        [[fonts.firaCode.files]]
            file = "FiraCode-Regular.ttf"
            name = "Fira Code Regular"
        [[fonts.firaCode.files]]
            file = "FiraCode-Bold.ttf"
            name = "Fira Code Bold"
        [[fonts.firaCode.files]]
            file = "FiraCode-Light.ttf"
            name = "Fira Code Light"
        [[fonts.firaCode.files]]
            file = "FiraCode-Medium.ttf"
            name = "Fira Code Medium"
        [[fonts.firaCode.files]]
            file = "FiraCode-Retina.ttf"
            name = "Fira Code Retina"
        [[fonts.firaCode.files]]
            file = "FiraCode-SemiBold.ttf"
            name = "Fira Code SemiBold"
